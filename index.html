<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI4EDA</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#024BA1;--blue-bg:#EDF2FB;--navy:#1A2A44;
  --white:#FFFFFF;--g50:#F8F9FA;--g100:#F1F3F5;--g200:#E9ECEF;
  --g300:#DEE2E6;--g500:#6C757D;--g700:#495057;--g900:#212529;
  --purple:#6A4C93;
}
body{font-family:"Helvetica Neue",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--g900);line-height:1.75;font-size:15px;background:var(--white)}

.topnav{position:fixed;top:0;left:0;right:0;height:52px;background:var(--blue);display:flex;align-items:center;justify-content:space-between;padding:0 32px;z-index:100;box-shadow:0 1px 6px rgba(0,0,0,.15)}
.topnav-title{color:var(--white);font-size:15px;font-weight:600;letter-spacing:.3px}

.hero{padding:100px 0 40px;text-align:center}
.hero h1{font-size:32px;font-weight:700;color:var(--blue)}

.posts-wrap{max-width:680px;margin:0 auto;padding:0 24px 60px}
.post-card{display:block;padding:20px 0;border-bottom:1px solid var(--g100);text-decoration:none;transition:background .15s}
.post-card:hover{background:var(--g50);margin:0 -24px;padding-left:24px;padding-right:24px;border-radius:6px}
.post-card .pc-meta{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.post-card .pc-date{font-size:12px;color:var(--g500)}
.post-card .pc-title{font-size:17px;font-weight:700;color:var(--navy);line-height:1.4}
.post-card:hover .pc-title{color:var(--blue)}
.post-card .pc-desc{font-size:13px;color:var(--g500);line-height:1.6;margin-top:2px}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.tag-purple{background:#F3E5F5;color:var(--purple)}
.tag-blue{background:var(--blue-bg);color:var(--blue)}

@media(max-width:760px){.hero h1{font-size:24px}}
</style>
</head>
<body>

<nav class="topnav">
  <div class="topnav-title">AI4EDA</div>
</nav>

<header class="hero">
  <h1>AI4EDA</h1>
</header>

<div class="posts-wrap">

  <a class="post-card" href="posts/harness-design-review.html">
    <div class="pc-meta">
      <span class="pc-date">2026-06-13</span>
      <span class="tag tag-purple">综述</span>
      <span class="tag tag-blue">Harness</span>
    </div>
    <div class="pc-title">Agent Harness 设计综述：17篇核心论文，看Harness如何自进化</div>
    <div class="pc-desc">从系统边界、自动生成、失败修复、模块演化和长期可靠性五个方向，系统梳理近期 Harness 研究，提炼 7 条设计原则和 7 个反模式。</div>
  </a>

</div>

</body>
</html>
